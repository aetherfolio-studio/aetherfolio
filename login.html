<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var host = window.location.hostname;
      if (host !== 'localhost' && host !== '127.0.0.1' && host !== 'aetherfolio.vercel.app') {
        window.location.replace('https://aetherfolio.vercel.app' + window.location.pathname + window.location.search + window.location.hash);
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Aetherfolio</title>
  <meta name="description" content="Log in to your Aetherfolio account.">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-auth.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <!-- Vercel Web Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
      body { 
          margin: 0; 
          background: #000;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          overflow: hidden;
      }
      
      /* Re-use the cinematic background logic */
      .site-background {
          position: absolute;
          top: 0; left: 0; width: 100vw; height: 100vh;
          z-index: -4;
          background-image: url('assets/bg_cinematic.jpg');
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
      }
      .site-background::after {
          content: ''; position: absolute; inset: 0;
          background: rgba(0, 0, 0, 0.65);
          z-index: 1;
      }

      /* Centered Glass Panel */
      .auth-panel {
          width: 100%;
          max-width: 400px;
          background: rgba(255, 255, 255, 0.02);
          backdrop-filter: blur(24px);
          -webkit-backdrop-filter: blur(24px);
          border: 1px solid rgba(255, 255, 255, 0.06);
          border-radius: 20px;
          padding: 40px 32px;
          position: relative;
          z-index: 10;
          box-sizing: border-box;
          box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .auth-header {
          text-align: center;
          margin-bottom: 40px;
      }

      .auth-logo {
          display: flex;
          flex-direction: column;
          align-items: center;
          margin-bottom: 32px;
          text-decoration: none;
      }
      .auth-logo img {
          height: 48px;
          margin-bottom: 12px;
      }
      .auth-logo .brand-name {
          font-family: var(--font-display);
          font-size: 1.1rem;
          font-weight: 500;
          letter-spacing: 0.3em;
          color: var(--text-primary);
          margin-bottom: 4px;
      }
      .auth-logo .brand-tagline {
          font-size: 0.6rem;
          color: var(--text-muted);
          letter-spacing: 0.15em;
          text-transform: uppercase;
      }

      .auth-title {
          font-size: 1.5rem;
          font-weight: 600;
          color: var(--text-primary);
          margin-bottom: 8px;
      }
      .auth-subtitle {
          font-size: 0.9rem;
          color: var(--text-secondary);
      }

      /* Custom Input Fields */
      .input-group {
          position: relative;
          margin-bottom: 16px;
      }
      .input-icon-left {
          position: absolute;
          left: 16px;
          top: 50%;
          transform: translateY(-50%);
          color: var(--text-muted);
          font-size: 1.2rem;
          pointer-events: none;
          transition: color 0.3s ease;
      }
      .input-icon-right {
          position: absolute;
          right: 16px;
          top: 50%;
          transform: translateY(-50%);
          color: var(--text-muted);
          font-size: 1.2rem;
          cursor: pointer;
          transition: color 0.3s ease;
      }
      .input-icon-right:hover {
          color: var(--text-primary);
      }
      
      .auth-input {
          width: 100%;
          background: rgba(0, 0, 0, 0.3);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 12px;
          padding: 14px 48px;
          color: var(--text-primary);
          font-size: 0.95rem;
          font-family: var(--font-body);
          box-sizing: border-box;
          transition: all 0.3s ease;
      }
      .auth-input::placeholder {
          color: var(--text-muted);
      }
      .auth-input:focus {
          outline: none;
          border-color: rgba(255, 255, 255, 0.2);
          background: rgba(0, 0, 0, 0.5);
      }
      .auth-input:focus + .input-icon-left {
          color: var(--text-primary);
      }

      .terms-text { font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-bottom: 24px; line-height: 1.5; margin-top: 16px; }
      .terms-text a { color: var(--text-secondary); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.2); transition: color 0.3s ease; }
      .terms-text a:hover { color: var(--text-primary); border-bottom-color: var(--text-primary); }

      /* Options row */
      .auth-options {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 32px;
          margin-top: 24px;
      }
      .checkbox-group {
          display: flex;
          align-items: center;
          gap: 8px;
          cursor: pointer;
      }
      .checkbox-group input {
          appearance: none;
          width: 16px;
          height: 16px;
          border: 1px solid rgba(255, 255, 255, 0.2);
          border-radius: 4px;
          background: transparent;
          cursor: pointer;
          position: relative;
      }
      .checkbox-group input:checked {
          background: var(--text-primary);
          border-color: var(--text-primary);
      }
      .checkbox-group input:checked::after {
          content: '✔';
          position: absolute;
          top: 50%; left: 50%;
          transform: translate(-50%, -50%);
          color: #000;
          font-size: 10px;
      }
      .checkbox-label {
          font-size: 0.85rem;
          color: var(--text-secondary);
      }
      .forgot-link {
          font-size: 0.85rem;
          color: var(--text-secondary);
          text-decoration: none;
          transition: color 0.3s ease;
      }
      .forgot-link:hover {
          color: var(--text-primary);
      }

      /* Submit Button */
      .auth-submit {
          width: 100%;
          background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 100%);
          border: 1px solid rgba(255, 255, 255, 0.15);
          border-radius: 12px;
          padding: 14px;
          color: var(--text-primary);
          font-size: 0.95rem;
          font-weight: 500;
          cursor: pointer;
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 8px;
          transition: all 0.3s ease;
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      .auth-submit:hover {
          background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.05) 100%);
          border-color: rgba(255, 255, 255, 0.3);
      }
      .auth-submit i {
          font-size: 1.1rem;
      }

      /* Divider */
      .auth-divider {
          display: flex;
          align-items: center;
          text-align: center;
          margin: 32px 0;
      }
      .auth-divider::before, .auth-divider::after {
          content: '';
          flex: 1;
          border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .auth-divider span {
          padding: 0 16px;
          font-size: 0.8rem;
          color: var(--text-muted);
      }

      /* Social Logins */
      .social-logins {
          display: flex;
          gap: 16px;
          justify-content: center;
          margin-bottom: 32px;
      }
      .social-btn {
          width: 48px;
          height: 48px;
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--text-primary);
          font-size: 1.2rem;
          cursor: pointer;
          transition: all 0.3s ease;
          text-decoration: none;
      }
      .social-btn:hover {
          background: rgba(255, 255, 255, 0.08);
          border-color: rgba(255, 255, 255, 0.2);
          transform: translateY(-2px);
      }

      /* Footer */
      .auth-footer {
          text-align: center;
          font-size: 0.85rem;
          color: var(--text-secondary);
      }
      .auth-footer a {
          color: var(--accent);
          text-decoration: none;
          font-weight: 500;
          transition: color 0.3s ease;
      }
      .auth-footer a:hover {
          color: var(--accent-hover);
      }
      
      @media (max-width: 480px) {
          .auth-panel {
              border-radius: 0;
              border: none;
              background: transparent;
              backdrop-filter: none;
              box-shadow: none;
              padding: 32px 24px;
          }
      }
  </style>
<link rel="icon" href="logo.png" type="image/png">
</head>
<body style="opacity: 0; transition: opacity 0.5s ease;" id="authBody">

<!-- Background -->
<div class="site-background"></div>

<!-- Back Button -->
<a href="index.html" style="position: absolute; top: 32px; left: 32px; color: var(--text-secondary); text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; z-index: 20; transition: color 0.3s ease;">
    <i class="ph ph-arrow-left"></i> Back to site
</a>

<!-- Centered Glass Panel -->
<div class="auth-panel">
    <div class="auth-header">
        <a href="index.html" class="auth-logo">
            <img src="logo.png" alt="Aetherfolio Logo">
            <div class="brand-name">AETHERFOLIO</div>
            <div class="brand-tagline">Design. Develop. Elevate.</div>
        </a>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Log in to your account to continue</p>
    </div>

    <form id="loginForm" novalidate>
        <div class="input-group">
            <input type="email" id="email" class="auth-input" placeholder="Email address" required>
            <i class="ph ph-user input-icon-left"></i>
        </div>
        
        <div class="input-group">
            <input type="password" id="password" class="auth-input" placeholder="Password" required>
            <i class="ph ph-lock input-icon-left"></i>
            <i class="ph ph-eye-slash input-icon-right" id="togglePassword"></i>
        </div>

        <div class="auth-options">
            <label class="checkbox-group">
                <input type="checkbox" id="rememberMe">
                <span class="checkbox-label">Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        
        <p class="terms-text">
            By continuing, you acknowledge that you have read and agree to Aetherfolio's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </p>

        <button type="submit" class="auth-submit" id="loginBtn">
            Log In <i class="ph ph-arrow-right"></i>
        </button>
        <p id="authError" style="color: #f87171; font-size: 0.85rem; margin-top: 16px; text-align: center; display: none;"></p>
    </form>

    <div class="auth-divider">
        <span>or continue with</span>
    </div>

    <div class="social-logins">
        <a href="#" class="social-btn" id="googleLoginBtn"><i class="ph ph-google-logo"></i></a>
    </div>

    <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
    </div>
</div>

<script>
    // Fade in on load
    window.onload = () => {
        document.getElementById('authBody').style.opacity = '1';
    };

    // Toggle Password Visibility
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    if (togglePassword) {
        togglePassword.addEventListener('click', () => {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            togglePassword.classList.toggle('ph-eye');
            togglePassword.classList.toggle('ph-eye-slash');
        });
    }

    // Connect to Supabase Auth script if it exists
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const authError = document.getElementById('authError');

    if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const emailVal = document.getElementById('email').value.trim();
            const passVal = document.getElementById('password').value;
            
            if (!emailVal || !passVal) {
                authError.textContent = 'Please fill in all fields.';
                authError.style.display = 'block';
                return;
            }

            const originalText = loginBtn.innerHTML;
            loginBtn.innerHTML = 'Logging in... <i class="ph ph-spinner-gap" style="animation: spin 1s linear infinite;"></i>';
            loginBtn.disabled = true;
            authError.style.display = 'none';

            if (window._aetherSupabase && window._aetherSupabase.auth) {
                const { data, error } = await window._aetherSupabase.auth.signInWithPassword({
                    email: emailVal,
                    password: passVal
                });

                if (error) {
                    authError.textContent = error.message;
                    authError.style.display = 'block';
                    loginBtn.innerHTML = originalText;
                    loginBtn.disabled = false;
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                // Mock success for design presentation
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }
        });
    }

    // Google OAuth Login
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    if (googleLoginBtn && window._aetherSupabase && window._aetherSupabase.auth) {
        googleLoginBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const { data, error } = await window._aetherSupabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/index.html'
                }
            });
            if (error) {
                console.error("Google login error:", error.message);
            }
        });
    }
    
    // Inject spinner keyframes if not present
    if (!document.getElementById('spinner-keyframes')) {
        const style = document.createElement('style');
        style.id = 'spinner-keyframes';
        style.textContent = `@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`;
        document.head.appendChild(style);
    }
</script>
</body>
</html>
